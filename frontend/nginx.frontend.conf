# AutoDS gateway: serves the built SPA and load-balances /api across all backend
# replicas. Using a variable in proxy_pass forces nginx to re-resolve the "backend"
# service name via Docker's embedded DNS (127.0.0.11), which returns every replica's
# IP round-robin — i.e. this nginx is the load balancer.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 210m;            # allow large uploads (backend cap is 200MB)

    # Static asset caching for the hashed Vite bundles.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;          # long enough for pipeline runs
    }

    # SPA client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
