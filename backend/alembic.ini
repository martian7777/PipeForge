# Alembic configuration for PipeForge.
#
#   cd backend
#   alembic upgrade head          # apply all migrations
#   alembic revision --autogenerate -m "describe change"
#   alembic downgrade -1          # roll back one
#
# The database URL is NOT set here on purpose -- env.py reads it from
# PIPEFORGE_DATABASE_URL (via app.config.settings) so migrations and the running app can
# never point at different databases.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Timestamped, sortable revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
