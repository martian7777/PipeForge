# PipeForge â€” horizontally scalable deployment.
#
#   docker compose up --build --scale backend=3
#
# Topology:
#   frontend (nginx)  â”€â”€ serves the SPA and load-balances /api across N backend replicas
#   backend  (N x)    â”€â”€ stateless FastAPI; JWT auth, shared Postgres + Redis + storage
#   db       (postgres) â”€â”€ shared relational store (replaces local SQLite)
#   redis             â”€â”€ shared rate-limit counters (so limits hold across replicas)
#
# Because the backend is stateless (JWT, no in-process session/state) and all shared
# state lives in Postgres / Redis / the mounted storage volume, you can raise the
# replica count freely.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pipeforge
      POSTGRES_PASSWORD: pipeforge
      POSTGRES_DB: pipeforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      PIPEFORGE_DATABASE_URL: postgresql+psycopg://pipeforge:pipeforge@db:5432/pipeforge
      PIPEFORGE_RATELIMIT_STORAGE: redis://redis:6379/0
      PIPEFORGE_JWT_SECRET: ${PIPEFORGE_JWT_SECRET:-please-override-with-a-32-byte-random-secret-in-prod}
      PIPEFORGE_CORS_ORIGINS: '["http://localhost:8080"]'

      # Schema is applied by `alembic upgrade head` in the entrypoint, never create_all.
      PIPEFORGE_AUTO_CREATE_TABLES: "false"

      # Public URL as the browser sees it. OAuth redirect URIs are derived from this,
      # so it must match what is registered with each identity provider.
      PIPEFORGE_PUBLIC_BASE_URL: ${PIPEFORGE_PUBLIC_BASE_URL:-http://localhost:8080}

      # Observability: JSON logs to stdout for the log shipper.
      PIPEFORGE_LOG_FORMAT: json
      PIPEFORGE_LOG_LEVEL: INFO

      # Token lifetimes. Short access tokens + rotating refresh tokens.
      PIPEFORGE_ACCESS_TOKEN_TTL_MINUTES: "15"
      PIPEFORGE_REFRESH_TOKEN_TTL_DAYS: "14"
      # Set to "true" once TLS terminates at the ingress (also enables HSTS).
      PIPEFORGE_REFRESH_COOKIE_SECURE: ${PIPEFORGE_REFRESH_COOKIE_SECURE:-false}

      # First admin. If unset, the first account to register becomes admin.
      PIPEFORGE_BOOTSTRAP_ADMIN_EMAIL: ${PIPEFORGE_BOOTSTRAP_ADMIN_EMAIL:-}

      # --- OAuth 2.0 / OIDC single sign-on ---
      # A provider turns on as soon as its client id + secret are present.
      # Redirect URI to register: {PUBLIC_BASE_URL}/api/auth/oauth/{provider}/callback
      PIPEFORGE_GOOGLE_CLIENT_ID: ${PIPEFORGE_GOOGLE_CLIENT_ID:-}
      PIPEFORGE_GOOGLE_CLIENT_SECRET: ${PIPEFORGE_GOOGLE_CLIENT_SECRET:-}
      PIPEFORGE_GITHUB_CLIENT_ID: ${PIPEFORGE_GITHUB_CLIENT_ID:-}
      PIPEFORGE_GITHUB_CLIENT_SECRET: ${PIPEFORGE_GITHUB_CLIENT_SECRET:-}
      PIPEFORGE_MICROSOFT_CLIENT_ID: ${PIPEFORGE_MICROSOFT_CLIENT_ID:-}
      PIPEFORGE_MICROSOFT_CLIENT_SECRET: ${PIPEFORGE_MICROSOFT_CLIENT_SECRET:-}
      PIPEFORGE_MICROSOFT_TENANT: ${PIPEFORGE_MICROSOFT_TENANT:-common}
      # Optional allow-list, e.g. '["yourcompany.com"]'
      PIPEFORGE_OAUTH_ALLOWED_EMAIL_DOMAINS: ${PIPEFORGE_OAUTH_ALLOWED_EMAIL_DOMAINS:-[]}
    volumes:
      - storage:/app/storage           # shared object storage across replicas
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Scale with:  docker compose up --scale backend=3
    deploy:
      replicas: 3

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  storage:
