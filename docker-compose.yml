# AutoDS — horizontally scalable deployment.
#
#   docker compose up --build --scale backend=3
#
# Topology:
#   frontend (nginx)  ── serves the SPA and load-balances /api across N backend replicas
#   backend  (N x)    ── stateless FastAPI; JWT auth, shared Postgres + Redis + storage
#   db       (postgres) ── shared relational store (replaces local SQLite)
#   redis             ── shared rate-limit counters (so limits hold across replicas)
#
# Because the backend is stateless (JWT, no in-process session/state) and all shared
# state lives in Postgres / Redis / the mounted storage volume, you can raise the
# replica count freely.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autods
      POSTGRES_PASSWORD: autods
      POSTGRES_DB: autods
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autods"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      AUTODS_DATABASE_URL: postgresql+psycopg://autods:autods@db:5432/autods
      AUTODS_RATELIMIT_STORAGE: redis://redis:6379/0
      AUTODS_JWT_SECRET: ${AUTODS_JWT_SECRET:-please-override-with-a-32-byte-random-secret-in-prod}
      AUTODS_CORS_ORIGINS: '["http://localhost:8080"]'
    volumes:
      - storage:/app/storage           # shared object storage across replicas
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Scale with:  docker compose up --scale backend=3
    deploy:
      replicas: 3

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  storage:
